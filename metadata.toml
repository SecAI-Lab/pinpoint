use = "The artifact reproduces the paper's effectiveness results (Tables III and IV) on 32 of the 300 target binaries, sized so that a complete run fits one free Colab session. Its numbers therefore approximate the paper's rather than matching them. It does not reproduce the efficiency results, which characterize a full-corpus run, and packages two of the five model configurations in Table III. See https://github.com/SecAI-Lab/pinpoint/blob/main/use.txt"
