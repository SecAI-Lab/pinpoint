hw = "A CUDA-capable NVIDIA GPU is required to run the artifact at a practical speed. The artifact has been verified on an NVIDIA T4 GPU using the free tier of Google Colab. The packaged evaluation requires approximately 4 GB of system RAM and approximately 1.5 GB of disk space, and fits comfortably within a T4's memory. Claim 1 takes about three hours on a T4 and claim 2 a few seconds."
sw = "The recommended execution environment is Google Colab. The artifact requires Python 3.9 or newer, PyTorch 2.0 or newer with CUDA for the BinShot backbone, and TensorFlow 2 for SAFE; it has been tested on Colab with Python 3.13, PyTorch 2.11, and TensorFlow 2.20, all of which Colab ships. Other Python dependencies are installed through the provided install.sh and requirements.txt. No disassembler and no paid software are needed."
